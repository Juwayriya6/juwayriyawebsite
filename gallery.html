<!DOCTYPE html>
<html lang="en">
<head>
  <meta charset="utf-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1" />
  <title>Portfolio — Juwayriya</title>
  <meta name="description" content="Portfolio — paintings and studies in jade light." />
  <link href="https://fonts.googleapis.com/css2?family=Cormorant+Garamond:wght@400;600&display=swap" rel="stylesheet">
  <link rel="stylesheet" href="assets/css/style.css" />
</head>
<body>
  <header class="subnav">
    <div class="bar">
      <a class="brand-mini" href="index.html">juwayriya</a>
      <nav class="links">
        <a class="active" href="gallery.html">portfolio</a>
        <a href="about.html">about</a>
        <a href="contact.html">contact</a>
      </nav>
    </div>
  </header>

  <main class="section">
    <div class="wrap-wide">
      <h1>Work</h1>
      <div class="filters" role="tablist">
        <button class="chip is-active" data-filter="all">All</button>
        <button class="chip" data-filter="paintings">Paintings</button>
        <button class="chip" data-filter="portraits">Portraits</button>
        <button class="chip" data-filter="studies">Studies</button>
      </div>

      <ul class="grid gallery" id="gallery-grid">
        <!-- Replace placeholders with your actual pieces -->
        <li class="item" data-group="paintings">
          <a href="assets/images/art1-1600.webp" data-full="assets/images/art1-1600.webp" data-caption="Lotus Constellations — Oil on canvas">
            <img src="assets/images/art1-800.webp" alt="Lotus Constellations" width="800" height="1000" loading="lazy">
          </a>
        </li>
        <li class="item" data-group="portraits">
          <a href="assets/images/art2-1600.webp" data-full="assets/images/art2-1600.webp" data-caption="Jade Echo — Oil on canvas">
            <img src="assets/images/art2-800.webp" alt="Jade Echo" width="800" height="1000" loading="lazy">
          </a>
        </li>
        <li class="item" data-group="studies">
          <a href="assets/images/art3-1600.webp" data-full="assets/images/art3-1600.webp" data-caption="Morning Orbit — study">
            <img src="assets/images/art3-800.webp" alt="Morning Orbit" width="800" height="1000" loading="lazy">
          </a>
        </li>
        <li class="item" data-group="paintings">
          <a href="assets/images/art4-1600.webp" data-full="assets/images/art4-1600.webp" data-caption="Fog Echo — Oil on canvas">
            <img src="assets/images/art4-800.webp" alt="Fog Echo" width="800" height="1000" loading="lazy">
          </a>
        </li>
      </ul>
    </div>
  </main>

  <!-- Lightweight lightbox -->
  <div id="lightbox" class="lightbox" aria-hidden="true">
    <button class="close" aria-label="Close">×</button>
    <img id="lightbox-img" alt="Expanded artwork">
    <div id="lightbox-cap" class="cap"></div>
  </div>

  <footer class="footer"><div class="wrap-wide small">© 2025 Juwayriya Abdullahi</div></footer>
  <script src="assets/js/main.js"></script>
</body>
</html>
