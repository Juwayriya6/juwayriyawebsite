<!doctype html>
<html lang="en">
<head>
  <meta charset="utf-8">
  <meta name="viewport" content="width=device-width, initial-scale=1">
  <title>Contact — Juwayriya Abdullahi</title>
  <link rel="stylesheet" href="assets/css/juwa-theme.css">
</head>
<body>
  <nav class="nav">
    <div class="nav__inner">
      <a class="brand" href="/">JUWAYRIYA ABDULLAHI</a>
      <div class="nav__spacer"></div>
      <div class="nav__links">
        <a href="index.html#work">Work</a>
        <a href="about.html">About</a>
        <a href="contact.html">Contact</a>
      </div>
    </div>
  </nav>
  <main class="section">
    <div class="container two-col">
      <div>
        <h1>Contact</h1>
        <p class="lead">For exhibitions, commissions, classes, or studio visits, use the form or email me directly.</p>
        <form name="contact" method="POST" data-netlify="true" netlify-honeypot="bot-field">
          <p class="hidden">
            <label>Don’t fill this out if you're human: <input name="bot-field" /></label>
          </p>
          <p>
            <label>Your name<br><input type="text" name="name" required style="width:100%; padding:10px"></label>
          </p>
          <p>
            <label>Email<br><input type="email" name="email" required style="width:100%; padding:10px"></label>
          </p>
          <p>
            <label>Message<br><textarea name="message" rows="6" required style="width:100%; padding:10px"></textarea></label>
          </p>
          <button class="btn" type="submit">Send</button>
        </form>
      </div>
      <div>
        <img src="assets/images/art2.png" alt="Artwork" style="width:100%; height:auto; border-radius:12px; border:1px solid rgba(139,108,176,0.2)">
      </div>
    </div>
  </main>
  <footer class="footer">
    <div class="container">
      <small>© 2025 Juwayriya Abdullahi</small>
    </div>
  </footer>
</body>
</html>
